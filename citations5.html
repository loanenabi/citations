<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>citations5</title>

	<style>
		body {
			font-family: sans-serif;
			background-color: beige;
			padding: 2.5rem;
		}

		section {
			display: flex;
			gap: 1rem;
		}

		div { flex: 1;
			border: 1px solid black;
			padding: 1.5rem;
			font-family: Georgia, serif;
			color: black;
			font-size: 1.2rem;
			line-height: 1.5;
			background-color: white; }

		.auteur { font-size: 0.8rem;
				color: gray; }
	</style>
</head>

<body>

	<section>
		<div>
			“It is better to have loved and lost than never to have loved at all.”
			<br><br>
			<span class="auteur">— Alfred Lord Tennyson</span>
		</div>

		<div>
			“The course of true love never did run smooth.”
			<br><br>
			<span class="auteur">— William Shakespeare</span>
		</div>
	</section>

</body>
</html>
